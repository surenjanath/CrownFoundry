org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.enableR8.fullMode=true

# Where a build with no referee looks for a newly published policy.
#
# `docs/` in this repository is served by GitHub Pages, and `tools/publish_engine.py` writes the
# manifest and the versioned artifact into `docs/engine/`. Setting it here rather than passing
# `-P` on every build is deliberate: the Play Store build ships `crownfoundry.backendUrl=none`,
# so this is the only channel it has, and a release built without it would silently be a release
# that can never update its opponent.
crownfoundry.engineManifestUrl=https://surenjanath.github.io/CrownFoundry/engine/manifest.json

# Play Games. The SDK is only compiled in when playGamesAppId is set - it installs a startup
# provider that throws if the manifest has no APP_ID, so a build without an id must not carry the
# dependency at all. Blanking the first line below is enough to ship without leaderboards.
#
# The board ids are not secret: they name a board, they do not authorise writing to one. The key
# on the left of each colon is what `Leaderboard.key` looks itself up by and must not change.
crownfoundry.playGamesAppId=859665176023
crownfoundry.playGamesLeaderboards=wins:CgkI16umwIIZEAIQAQ,streak:CgkI16umwIIZEAIQAg,puzzles:CgkI16umwIIZEAIQAw
